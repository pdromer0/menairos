    motivo_critica: "Crea repos y cambia ajustes de GitHub"
    donde: local
    especificacion:
      - "hito-0.md#34-menairos-entorno"
      - "hito-0.md#37-casos-límite"
    criterios_aceptacion:
      - "La capa GitHub crea el repo y aplica los ajustes de 3.4; en un repo privado sin GitHub Pro, el ruleset es un aviso"
      - "La capa nube genera scripts/entorno-nube.sh y las instrucciones para la nube de Claude Code y de Codex"
      - "--comprobar no escribe nada y verifica por la API también lo que Pedro hizo en la web"
      - "menairos entorno sobre menairos-prueba termina con --comprobar en verde"

  - id: T-13
    titulo: "Comprobaciones deliberadas automáticas"
    rama: feat/h0-comprobaciones
    depende_de: [T-10]
    area: entorno
    especificacion: ["hito-0.md#36-comprobaciones-deliberadas-automáticas"]
    criterios_aceptacion:
