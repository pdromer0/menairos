      - "Las remotas se verifican leyendo por la API el ruleset y el check obligatorio, sin provocar un push"
      - "La clave falsa se inventa en cada ejecución y nunca sale del worktree temporal"

  - id: T-14
    titulo: "/preparar-entorno"
    rama: feat/h0-preparar-entorno
