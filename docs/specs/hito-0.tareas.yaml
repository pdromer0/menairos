      - "La sustitución rellena {{clave}} desde menairos.toml; un hueco sin rellenar o una clave inexistente es un error, con test"
      - "Un hito generado desde las plantillas pasa spec validar"

  - id: T-10
    titulo: "Plantillas base y python-uv, manifiesto y composición"
    rama: feat/h0-plantillas-stack
    depende_de: [T-09]
    area: plantillas
    critica: true
    motivo_critica: "Fija el contrato común de las plantillas de stack, del que depende /implementar"
    especificacion: ["hito-0.md#33-plantillas-de-stack-y-contrato-común"]
    criterios_aceptacion:
      - "base y python-uv tienen su plantilla.toml con herramientas, órdenes del contrato, ficheros fusionables y comprobaciones"
      - "La composición respeta requiere y stack.plantillas; dos plantillas con el mismo fichero no fusionable dan error, con test"
      - "Un proyecto generado con base + python-uv en una carpeta temporal pasa su propia N3 (test slow)"
      - "n1.sh, n2.sh y n3.sh salen con 0 o 1 y dicen qué ejecutaron"

  - id: T-11
    titulo: "menairos entorno: capas local y repo"
    rama: feat/h0-entorno-local
    depende_de: [T-10]
    area: entorno
    especificacion:
      - "hito-0.md#34-menairos-entorno"
      - "hito-0.md#37-casos-límite"
    criterios_aceptacion:
      - "La capa local comprueba herramientas y versiones, la ruta (nunca /mnt/c) y .wslconfig, y no instala nada en el sistema"
      - "La capa repo aplica las plantillas sin sobrescribir nunca un fichero existente y lista los conflictos"
      - "Cada paso termina en ok, hecho, manual o error, y repetir la orden no cambia nada"
      - "Los casos límite de 3.7 de estas dos capas tienen test"

  - id: T-12
    titulo: "menairos entorno: capas GitHub y nube, y --comprobar"
    rama: feat/h0-entorno-github
    depende_de: [T-11, T-07]
