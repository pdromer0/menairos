# Tareas del hito 0 de Menairos — núcleo en modo manual
# Estado: v1 (2026-11-25), división aceptada por Pedro.
# Formato: src/menairos/esquemas/tareas.schema.json (T-05). Los enlaces apuntan a secciones de hito-0.md.

hito: 0
titulo: "Hito 0 — Núcleo en modo manual"
tareas:

  # ── H0.0 Arranque ──────────────────────────────────────────────────────────

  - id: T-01
    titulo: "Repo, protección y pasos manuales"
    rama: chore/h0-repo
    depende_de: []
    area: arranque
    donde: local
    especificacion: ["hito-0.md#12-repo-y-protección"]
    criterios_aceptacion:
      - "pdromer0/menairos existe, es público y no contiene nada personal"
      - "El ruleset «Proteger main» exige PR, el check ci y rama al día, impide push forzado y borrado, y solo Pedro (su usuario) está en la lista de excepciones, y solo por PR (`bypass_mode: pull_request`); comprobado por la API"
      - "Escaneo de secretos, protección de push, alertas de Dependabot e informe privado de vulnerabilidades activados; comprobado por la API"
      - "Fusión solo por squash, borrar la rama al fusionar y auto-merge permitido; comprobado por la API"
      - "La aprobación obligatoria de los workflows de PR de forks (all_external_contributors) está activada; comprobado por la API"

  - id: T-02
    titulo: "Esqueleto del paquete, stack, CI y comprobaciones deliberadas"
    rama: chore/h0-esqueleto
    depende_de: [T-01]
    area: arranque
    especificacion:
      - "hito-0.md#13-estructura-inicial"
      - "hito-0.md#17-comprobaciones-deliberadas"
    criterios_aceptacion:
      - "La estructura de 1.3 existe; `menairos --version` responde con la versión del paquete"
      - "El CI ejecuta ruff, pyright y pytest sin secretos, con las acciones fijadas por SHA, y está en verde; su job se llama ci, sin matriz, el check que exige el ruleset"
      - "scripts/n1.sh y scripts/n3.sh salen con 0 o 1 y dicen qué ejecutaron; el CI llama a scripts/n3.sh"
      - "CodeQL con la configuración por defecto (`python` y `actions`), activado por la API ya con código Python; comprobado por la API"
      - "Las cinco comprobaciones deliberadas de 1.7 se provocaron, saltaron con el mensaje esperado y se deshicieron; anotado en el anexo"
      - "Las versiones de las herramientas se verificaron con herramientas en el momento y constan en el anexo"

  - id: T-03
    titulo: "Documentos al repo y los 20 ADRs"
    rama: docs/h0-documentos-adrs
    depende_de: [T-02]
    area: arranque
    especificacion:
      - "hito-0.md#14-documentos-del-project-al-repo"
      - "hito-0.md#15-adrs-iniciales"
    criterios_aceptacion:
      - "producto.md, diseno.md, hitos.md, specs/hito-0.md, specs/hito-0.tareas.yaml y abiertas.md están en docs/ con el contenido del Project, citando los proyectos del método v2 de forma genérica (sin sus nombres)"
      - "Ningún fichero del repo nombra los proyectos del método v2: comprobado con un grep de sus nombres lanzado desde la terminal (el patrón no se guarda en el repo)"
      - "Los 20 ADRs de 1.5 están en docs/decisiones/ con los campos Tipo, Decidido por y Reversibilidad; el 0020 es de tipo stack"
      - "Los documentos del Project, salvo su documento de seguimiento, están marcados como archivados"

  - id: T-04
    titulo: "Verificación temprana del plugin (V-plugin) y repo de prueba"
    rama: ci/h0-v-plugin
    depende_de: [T-02]
    area: arranque
    critica: true
    motivo_critica: "Su resultado decide si se aplica el plan B del plugin (diseno.md 2.1), que cambia cómo se distribuye Menairos"
    especificacion: ["hito-0.md#16-verificación-temprana-del-plugin-v-plugin"]
    criterios_aceptacion:
      - "El marketplace (.claude-plugin/marketplace.json) y el plugin (plugin/) pasan claude plugin validate sin avisos, y la skill hola responde con la versión del plugin y la ruta desde la que se cargó"
      - "tests/test_plugin.py comprueba que la versión de plugin.json y la de la skill coinciden con la del paquete"
      - "pdromer0/menairos-prueba existe, público, con un .claude/settings.json que declara el marketplace y habilita el plugin, y una copia de la skill en .claude/skills/"
      - "Las pruebas A, B, C y D de 1.6 tienen resultado, anotado en el anexo y en abiertas.md"
      - "La decisión sobre la nube (plugin + script de entorno, o plan B) la toma Pedro y queda en diseno.md 2.1"

  # ── H0.1 Contratos ─────────────────────────────────────────────────────────

  - id: T-05
    titulo: "Esquemas JSON"
    rama: feat/h0-esquemas
    depende_de: [T-02]
    area: contratos
    critica: true
    motivo_critica: "Define el contrato versionado de Menairos: cambiarlo después es una versión mayor"
    especificacion: ["hito-0.md#22-esquemas"]
    criterios_aceptacion:
      - "menairos.schema.json, tareas.schema.json y decisiones.schema.json están en src/menairos/esquemas/ (dentro del paquete, leídos con importlib.resources) con additionalProperties false en todos los objetos y sus valores por defecto"
      - "tests/data/ tiene un ejemplo válido y uno inválido por cada regla de las tablas de 2.2"
      - "La marca de una decisión se calcula (difícil o impacto alto) y difícil + alto + decidido_por agente es un error; los dos con test"

  - id: T-06
    titulo: "menairos spec validar (E01–E13 y avisos)"
    rama: feat/h0-spec-validar
    depende_de: [T-05]
    area: contratos
    especificacion: ["hito-0.md#23-menairos-spec-validar"]
    criterios_aceptacion:
      - "Detecta E01 a E13 y A01 a A03, cada uno con su test"
      - "Salida JSON con codigo, mensaje, fichero y ruta; códigos de salida 0, 1 y 2"
      - "Las anclas se calculan como GitHub, con acentos, signos, código y encabezados repetidos, con test"
      - "Los casos límite de 2.3 tienen test"

  - id: T-07
    titulo: "Envoltorio de gh api y doble de GitHub con tope"
    rama: feat/h0-gh
    depende_de: [T-02]
    area: contratos
    especificacion:
      - "hito-0.md#24-menairos-spec-publicar"
    criterios_aceptacion:
      - "Todas las llamadas a GitHub de la CLI pasan por un único envoltorio de gh api, solo REST"
      - "El doble de GitHub registra las llamadas, simula paginación y fallos, y lanza un error claro al pasar su tope de llamadas"
      - "Ningún test llama a GitHub de verdad"

  - id: T-08
    titulo: "menairos spec publicar"
    rama: feat/h0-spec-publicar
    depende_de: [T-06, T-07]
    area: contratos
    critica: true
    motivo_critica: "Escribe en GitHub (etiquetas, milestones, issues, dependencias)"
    especificacion: ["hito-0.md#24-menairos-spec-publicar"]
    criterios_aceptacion:
      - "Crea etiquetas, milestone, issues con la marca oculta y dependencias «blocked by», en ese orden; --seco no escribe nada"
      - "Cada caso de la tabla de idempotencia y cada caso límite de 2.4 tiene test con el doble"
      - "La ruta REST para crear y quitar dependencias está verificada en la documentación y en el repo de prueba; anotado en el anexo"
      - "Publicación real en menairos-prueba ejecutada dos veces: la segunda no escribe nada"
      - "Los issues del hito 0 publicados en pdromer0/menairos con spec publicar; los de T-01 a T-08, ya hechas, cerrados por Pedro con un enlace a su PR"

  # ── H0.2 Plantillas y entorno ──────────────────────────────────────────────

  - id: T-09
    titulo: "Plantillas de documentos y sustitución {{…}}"
    rama: feat/h0-plantillas-docs
    depende_de: [T-05]
    area: plantillas
    especificacion: ["hito-0.md#32-plantillas-de-documentos"]
    criterios_aceptacion:
