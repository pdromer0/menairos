[project]
name = "menairos"
version = "3.0.0.dev0"
description = "Método de desarrollo con agentes de IA, distribuido como plugin de Claude Code"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.4",
]

[project.scripts]
menairos = "menairos.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "slow: tests lentos, excluibles con -m 'not slow'",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
]
