[project]
name = "menairos"
version = "3.0.0.dev0"
description = "Método de desarrollo con agentes de IA, distribuido como plugin de Claude Code"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
menairos = "menairos.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "slow: tests lentos, excluibles con -m 'not slow'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]
